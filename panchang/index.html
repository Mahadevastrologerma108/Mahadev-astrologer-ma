<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>Hindu Panchang 2026 | Mahadev Astrologer</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Yearly Hindu Panchang 2026 – Festivals, Amavasya, Purnima, Ekadashi by Mahadev Astrologer" />

  <!-- Panchang CSS (isolated) -->
  <link rel="stylesheet" href="css/panchang.css" />

  <!-- Optional: Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="p-header">
    <div class="container">
      <h1>🕉️ Hindu Panchang</h1>
      <p class="subtitle">Yearly Panchang • Festivals • Vrat • Tithi</p>

      <nav class="p-nav">
        <a href="../index.html">Home</a>
        <a href="#calendar">Panchang</a>
        <a href="#highlights">Highlights</a>
      </nav>
    </div>
  </header>

  <!-- ===== YEAR SELECT ===== -->
  <section class="year-select">
    <div class="container">
      <label for="year">Select Year:</label>
      <select id="year">
        <option value="2026" selected>2026</option>
        <!-- Future years will come -->
      </select>
    </div>
  </section>

  <!-- ===== PANCHANG CALENDAR ===== -->
  <main class="container">
    <section id="calendar" class="calendar">
      <h2>📅 Panchang Calendar</h2>

      <!-- Month cards will be injected by JS -->
      <div id="calendarGrid" class="calendar-grid">
        <!-- JS DATA LOAD -->
      </div>
    </section>

    <!-- ===== HIGHLIGHTS ===== -->
    <section id="highlights" class="highlights">
      <h2>✨ Special Highlights</h2>

      <div class="highlight-box amavasya">
        🌑 Amavasya
      </div>

      <div class="highlight-box purnima">
        🌕 Purnima
      </div>

      <div class="highlight-box ekadashi">
        🌿 Ekadashi
      </div>

      <p class="note">
        * Highlighted dates are based on Hindu lunar calendar.
      </p>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="p-footer">
    <div class="container">
      <p>© 2026 Mahadev Astrologer</p>
      <p class="small">
        Panchang data is for religious reference only.
      </p>
    </div>
  </footer>

  <!-- ===== PANCHANG JS ===== -->
  <script src="js/panchang.js"></script>

</body>
</html>
