<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Panchang | Mahadev Astrologer</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        /* Agar style.css load na ho toh backup ke liye thodi basic styling */
        .gold-text { color: #D4AF37; text-align: center; }
        .panchang-container { padding: 20px; max-width: 800px; margin: auto; }
        .data-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; }
    </style>
</head>
<body class="dark-theme"> <header>
        <h1 class="gold-text" data-en="Mahadev Astrologer" data-hi="महादेव एस्ट्रोलॉजर">Mahadev Astrologer</h1>
        <button id="toggleLang" class="gold-btn">Switch to Hindi</button>
    </header>

    <main class="panchang-container">
        <h2 id="rashi-title" class="gold-text">Panchang</h2>
        <p id="selected-date-display" style="text-align: center; color: #aaa;"></p>

        <div class="gold-border" style="margin-top: 20px;">
            <div class="data-row">
                <span data-en="Tithi" data-hi="तिथि">Tithi</span>
                <span id="tithi-val" class="gold-text">--</span>
            </div>
            <div class="data-row">
                <span data-en="Nakshatra" data-hi="नक्षत्र">Nakshatra</span>
                <span id="nakshatra-val" class="gold-text">--</span>
            </div>
            <div class="data-row">
                <span data-en="Yoga" data-hi="योग">Yoga</span>
                <span id="yoga-val" class="gold-text">--</span>
            </div>
            <div class="data-row">
                <span data-en="Karana" data-hi="करण">Karana</span>
                <span id="karana-val" class="gold-text">--</span>
            </div>
            <div class="data-row">
                <span data-en="Sunrise" data-hi="सूर्योदय">Sunrise</span>
                <span id="sunrise-val">--</span>
            </div>
            <div class="data-row">
                <span data-en="Sunset" data-hi="सूर्यास्त">Sunset</span>
                <span id="sunset-val">--</span>
            </div>
        </div>

        <div id="calendar-grid" style="margin-top: 30px;"></div>
    </main>

    <footer style="margin-top: 50px; text-align: center;">
        <p>&copy; 2026 Mahadev Astrologer</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
