<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aries Rashifal 2026</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #0a0a0a; color: #f5c542; font-family: 'Cinzel', serif; padding: 20px; }
        .box { border: 1px solid rgba(245,197,66,0.3); padding: 30px; border-radius: 15px; background: rgba(245,197,66,0.02); max-width: 800px; margin: 100px auto; }
        .data-text { color:#fff; font-family: 'Poppins', sans-serif; font-weight: 300; display: block; margin-top: 5px; }
        hr { border: 0; border-top: 1px solid rgba(245,197,66,0.1); margin: 20px 0; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="box">
        <h1 id="rashi-title">Loading...</h1>
        <p id="todayDate" style="color: #888;"></p>
        <hr>
        
        <h3>Career: <span id="h-career" class="data-text"></span></h3>
        <h3>Love: <span id="h-love" class="data-text"></span></h3>
        <h3>Health: <span id="h-health" class="data-text"></span></h3>
        <hr>
        <h3>Lucky Color: <span id="h-color" style="color:#fff;"></span></h3>
        <h3>Lucky Number: <span id="h-number" style="color:#fff;"></span></h3>
        <hr>
        <p><strong>Tip:</strong> <span id="h-tip" class="data-text"></span></p>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translation.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="horoscope-data.js"></script> <script src="../assets/js/horoscope-handler.js"></script> <script>
        window.onload = () => {
            // Check if data is loaded
            if(typeof window.dailyHoroscope !== 'undefined') {
                console.log("✅ Mahadev: Data Connected");
                loadHoroscope('aries'); 
            } else {
                console.error("❌ Mahadev: Data File Missing or window.dailyHoroscope not defined!");
                document.getElementById('rashi-title').innerText = "Data Error";
            }
        };
    </script>
</body>
</html>
