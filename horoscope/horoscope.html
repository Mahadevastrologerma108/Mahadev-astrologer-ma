<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashifal 2026 | Divine Guidance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/horoscope-style.css"> <style>
        :root { --gold: #f5c542; --dark-bg: #0a0a0a; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; }

        .selection-container {
            max-width: 1100px;
            margin: 120px auto 60px;
            padding: 0 20px;
            text-align: center;
        }

        .selection-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .selection-header p {
            color: #888;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* Rashi Grid Styles */
        .rashi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .rashi-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(245, 197, 66, 0.1);
            padding: 30px 15px;
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .rashi-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            background: rgba(245, 197, 66, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .rashi-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
        }

        .rashi-name {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .rashi-sub {
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .selection-header h1 { font-size: 1.8rem; }
            .rashi-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="selection-container">
        <div class="selection-header">
            <h1 data-key="horoscope_title">दैनिक राशिफल</h1>
            <p data-key="horoscope_subtitle">अपनी राशि चुनें और आज का परामर्श प्राप्त करें</p>
        </div>

<div class="magic-tool-container">
    <h3 class="royal-title" data-key="finder_title">🔱 अपना राशि पहचानें (Rashi Finder)</h3>
    <div class="finder-grid">
        <div class="finder-box">
            <label data-key="finder_name_label">नाम के पहले अक्षर से:</label>
            <select id="nameFinder" onchange="handleMagicFind(this.value)">
                <option value="" data-key="finder_select">अक्षर चुनें...</option>
                <option value="aries">अ, ल, ई (A, L, E)</option>
                <option value="taurus">ब, व, उ (B, V, U)</option>
                <option value="gemini">क, छ, घ (K, CH, G)</option>
                <option value="cancer">ही, हू, हे, हो (H, D)</option>
                <option value="leo">मा, मी, मू, मे (M, T)</option>
                <option value="virgo">टो, पा, पी, पू (P, T, N)</option>
                <option value="libra">रा, री, रू, रे (R, T)</option>
                <option value="scorpio">तो, ना, नी, नू (N, Y)</option>
                <option value="sagittarius">ये, यो, भा, भी (B, D, P)</option>
                <option value="capricorn">भो, जा, जी, खी (J, K)</option>
                <option value="aquarius">गू, गे, गो, सा (S, G, D)</option>
                <option value="pisces">दी, दू, थ, झ (D, C, T)</option>
            </select>
        </div>

        <div class="divider" data-key="finder_divider">या</div>

        <div class="finder-box">
            <label data-key="finder_date_label">जन्म तिथि और महीने से:</label>
            <select id="monthFinder" onchange="handleMagicFind(this.value)">
                <option value="" data-key="finder_select">तारीख और महीना चुनें...</option>
                <option value="capricorn">15 Jan - 12 Feb (मकर)</option>
                <option value="aquarius">13 Feb - 13 Mar (कुंभ)</option>
                <option value="pisces">14 Mar - 12 Apr (मीन)</option>
                <option value="aries">13 Apr - 13 May (मेष)</option>
                <option value="taurus">14 May - 13 Jun (वृषभ)</option>
                <option value="gemini">14 Jun - 15 Jul (मिथुन)</option>
                <option value="cancer">16 Jul - 15 Aug (कर्क)</option>
                <option value="leo">16 Aug - 15 Sep (सिंह)</option>
                <option value="virgo">16 Sep - 16 Oct (कन्या)</option>
                <option value="libra">17 Oct - 14 Nov (तुला)</option>
                <option value="scorpio">15 Nov - 14 Dec (वृश्चिक)</option>
                <option value="sagittarius">15 Dec - 14 Jan (धनु)</option>
            </select>
        </div>
    </div>
    <div id="magicResult" class="result-card-box"></div>
</div>
