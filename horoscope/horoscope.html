<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashifal 2026 | Divine Guidance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        :root { --gold: #f5c542; --dark-bg: #0a0a0a; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; }

        .selection-container {
            max-width: 1100px;
            margin: 120px auto 60px;
            padding: 0 20px;
            text-align: center;
        }

        .selection-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .selection-header p {
            color: #888;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* 🔱 Rashi Grid Logic */
        .rashi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .rashi-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(245, 197, 66, 0.1);
            padding: 30px 15px;
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Card Decoration */
        .rashi-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(245, 197, 66, 0.05) 0%, transparent 70%);
            transition: 0.5s;
            opacity: 0;
        }

        .rashi-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            background: rgba(245, 197, 66, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .rashi-card:hover::before { opacity: 1; }

        .rashi-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
        }

        .rashi-name {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .rashi-sub {
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .selection-header h1 { font-size: 1.8rem; }
            .rashi-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }
    </style>
</head>

        <div class="rashi-grid">
            <a href="aries.html" class="rashi-card">

            <a href="leo.html" class="rashi-card">

            <a href="virgo.html" class="rashi-card">
