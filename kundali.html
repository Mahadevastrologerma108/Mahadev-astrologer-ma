<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHADEV ASTRO - Trial Engine</title>
    <link rel="stylesheet" href="assets/css/kundali-style.css">
</head>
<body>

<div class="container">
    <h2>🚩 Trial Logic Engine</h2>
    
    <div class="input-group">
        <label>Birth Date</label>
        <input type="date" id="dob" value="1990-04-13">
    </div>
    
    <div class="input-group">
        <label>Birth Time</label>
        <input type="time" id="tob" value="19:25">
    </div>

    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Latitude</label>
            <input type="number" id="lat" value="25.76" step="0.01">
        </div>
        <div style="flex: 1;">
            <label>Longitude</label>
            <input type="number" id="lon" value="82.68" step="0.01">
        </div>
    </div>

    <button id="runBtn">RUN CALCULATION TEST</button>

    <div id="output">
        <div class="res-header">🔱 MAIN ANALYSIS</div>
        <div class="res-item">Moon Degree: <span id="out-moon" class="val"></span></div>
        <div class="res-item">Nakshatra: <span id="out-nak" class="val"></span></div>
        <div class="res-item">Yogini: <span id="out-yog" class="val"></span></div>
        <div class="res-item">Frequency: <span id="out-freq" class="val"></span></div>
        
        <hr style="border: 0.5px solid #333; margin: 15px 0;">
        
        <div class="res-header">🪐 NAVAGRAHA POSITIONS</div>
        <div id="planets-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem;">
            </div>

        <div class="res-item" style="margin-top:15px; font-size: 0.8rem; font-style: italic;">
            Benefit: <span id="out-benefit"></span>
        </div>
    </div> </div> <script src="assets/js/astro-engine.js"></script>

</body>
</html>
