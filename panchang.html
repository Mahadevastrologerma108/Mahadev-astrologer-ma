<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Daily Panchang | Mahadev Astrologer" data-hi="दैनिक पंचांग | महादेव एस्ट्रोलॉजर">दैनिक पंचांग | महादेव एस्ट्रोलॉजर</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <h1 data-en="Mahadev Astrologer" data-hi="महादेव एस्ट्रोलॉजर">महादेव एस्ट्रोलॉजर</h1>
        <nav>
            <a href="index.html" class="nav-link" data-en="Home" data-hi="होम">होम</a> | 
            <a href="panchang.html" class="nav-link" data-en="Panchang" data-hi="पंचांग">पंचांग</a>
        </nav>
        <button onclick="switchLanguage()" class="btn-gold" id="langBtn" style="margin-top:10px;">English</button>
    </header>

    <main class="container">
        <section class="gold-card" id="daily-details">
            <h2 id="date-display" style="text-align: center; color: #D4AF37;"></h2>
            
            <div class="row">
                <span data-en="Tithi" data-hi="तिथि">तिथि</span>
                <span id="tithi" class="gold-text">--</span>
            </div>
            <div class="row">
                <span data-en="Sunrise" data-hi="सूर्योदय">सूर्योदय</span>
                <span id="sunrise">--</span>
            </div>
            <div class="row">
                <span data-en="Sunset" data-hi="सूर्यास्त">सूर्यास्त</span>
                <span id="sunset">--</span>
            </div>
            </section>

        <section class="gold-card">
            <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button onclick="changeMonth(-1)" class="btn-gold" aria-label="Previous Month">&lt;</button>
                <h3 id="current-month-display" style="color: #D4AF37; margin: 0; min-width: 150px; text-align: center;">--</h3>
                <button onclick="changeMonth(1)" class="btn-gold" aria-label="Next Month">&gt;</button>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                </div>
        </section>

        <section class="gold-card" id="events-section">
            <h3 style="text-align: center; color: #D4AF37; margin-bottom:15px;" 
                data-en="Festivals of the Month" data-hi="इस महीने के त्योहार">इस महीने के त्योहार</h3>
            
            <div id="event-list-container">
                </div>
        </section>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="btn-gold" style="text-decoration: none; display: inline-block;" data-en="← Back to Home" data-hi="← होम पेज पर वापस">← होम पेज पर वापस</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mahadev Astrologer - <span data-en="All Rights Reserved" data-hi="सर्वाधिकार सुरक्षित">सर्वाधिकार सुरक्षित</span></p>
    </footer>

   <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/firebase-handler.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
