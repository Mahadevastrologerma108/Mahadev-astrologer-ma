<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Master Translator - GitHub Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid #334155; }
        #upload-box { border: 2px dashed #64748b; padding: 40px; margin-bottom: 20px; cursor: pointer; border-radius: 15px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        button { padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; border: none; color: white; }
        #startBtn { background: #3b82f6; }
        #translateBtn { background: #10b981; display: none; }
        #downloadPdfBtn { background: #f59e0b; display: none; }
        #status { margin: 20px 0; color: #38bdf8; font-family: monospace; }
        .output-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .text-box { text-align: left; background: #020617; padding: 15px; border-radius: 8px; white-space: pre-wrap; height: 350px; overflow-y: auto; display: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 Master Astro Translator</h2>
    <div id="upload-box" onclick="document.getElementById('fileInput').click()">
        📁 PDF Select Karein
        <input type="file" id="fileInput" hidden accept="application/pdf">
    </div>
    <div class="btn-group">
        <button id="startBtn" disabled>1. Scan English</button>
        <button id="translateBtn">2. Translate (Astro-AI)</button>
        <button id="downloadPdfBtn">3. Save Hindi PDF</button>
    </div>
    <div id="status">Taiyaar...</div>
    <div class="output-wrapper">
        <div id="output" class="text-box"></div>
        <div id="hindiOutput" class="text-box"></div>
    </div>
</div>
<canvas id="pdf-canvas"></canvas>

<script>
    // Astro Library
    const astroDictionary = {
        "Sun": "सूर्य", "Mon": "चंद्र", "Mar": "मंगल", "Mer": "बुध", "Jup": "गुरु", "Ven": "शुक्र", "Sat": "शनि", "Rah": "राहू", "Ket": "केतु", "Asc": "लग्न",
        "Ashwini": "अश्विनी", "Bharani": "भरणी", "Krittika": "कृत्तिका", "Rohini": "रोहिणी", "Mrigashira": "मृगशिरा", "Ardra": "आर्द्रा", "Punarvasu": "पुनर्वसु", "Pushya": "पुष्य", "Ashlesha": "अश्लेषा", "Magha": "मघा", "Purva Phalguni": "पूर्वा फाल्गुनी", "Uttara Phalguni": "उत्तर फाल्गुनी", "Hasta": "हस्त", "Chitra": "चित्रा", "Swati": "स्वाति", "Vishakha": "विशाखा", "Anuradha": "अनुराधा", "Jyeshtha": "ज्येष्ठा", "Mula": "मूल", "Purva Ashadha": "पूर्वाषाढ़ा", "Uttara Ashadha": "उत्तराषाढ़ा", "Shravana": "श्रवण", "Dhanishta": "धनिष्ठा", "Shatabhisha": "शतभिषा", "Purva Bhadrapada": "पूर्वाभाद्रपद", "Uttara Bhadrapada": "उत्तराभाद्रपद", "Revati": "रेवती",
        "Combust": "अस्त", "Exalted": "उच्च", "Debilitated": "नीच", "Retrograde": "वक्री", "Direct": "मार्गी", "House": "भाव", "Sign": "राशि", "Degree": "अंश"
    };

    const fileInput = document.getElementById('fileInput');
    const startBtn = document.getElementById('startBtn');
    const translateBtn = document.getElementById('translateBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const hindiOutput = document.getElementById('hindiOutput');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    fileInput.onchange = (e) => {
        if (e.target.files[0]) {
            startBtn.disabled = false;
            status.innerText = "File ready: " + e.target.files[0].name;
        }
    };

    startBtn.onclick = async () => {
        startBtn.disabled = true;
        status.innerText = "Scanning...";
        const fileReader = new FileReader();
        fileReader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({data: typedarray}).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            const worker = await Tesseract.createWorker('eng', 1);
            const { data: { text } } = await worker.recognize(canvas);
            await worker.terminate(); 

            output.innerText = text;
            output.style.display = "block";
            status.innerText = "Scan Complete!";
            translateBtn.style.display = "inline-block";
            startBtn.disabled = false;
        };
        fileReader.readAsArrayBuffer(fileInput.files[0]);
    };

    translateBtn.onclick = async () => {
        let engText = output.innerText;
        status.innerText = "Translating...";
        const sortedKeys = Object.keys(astroDictionary).sort((a, b) => b.length - a.length);
        sortedKeys.forEach(key => {
            let regex = new RegExp("\\b" + key + "\\b", "gi");
            engText = engText.replace(regex, astroDictionary[key]);
        });

        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(engText)}`);
        const data = await res.json();
        let final = "";
        data[0].forEach(line => { if(line[0]) final += line[0]; });
        hindiOutput.innerText = final;
        hindiOutput.style.display = "block";
        downloadPdfBtn.style.display = "inline-block";
        status.innerText = "Done!";
    };

    downloadPdfBtn.onclick = async () => {
        status.innerText = "Building PDF...";
        try {
            const { PDFDocument, rgb } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            pdfDoc.registerFontkit(fontkit);

            // GitHub par ye line 100% kaam karegi agar font file wahan upload hai
            const fontUrl = './hindi-font.ttf'; 
            const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);

            const page = pdfDoc.addPage([canvas.width, canvas.height]);
            page.drawText(hindiOutput.innerText, {
                x: 50, y: canvas.height - 50, size: 14,
                font: customFont, color: rgb(0, 0, 0),
                maxWidth: canvas.width - 100, lineHeight: 20
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Translated_Astro.pdf";
            link.click();
            status.innerText = "Success!";
        } catch (e) {
            status.innerText = "Font Error: Make sure hindi-font.ttf is in GitHub repo.";
            console.error(e);
        }
    };
</script>
</body>
</html>
