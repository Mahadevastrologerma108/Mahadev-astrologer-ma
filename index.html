<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Vedic Astrology Lab</title>
    <style>
        body { background-color: #0c0c0c; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; border: 2px solid #d4af37; padding: 25px; border-radius: 15px; background: #111; box-shadow: 0 0 30px rgba(212,175,55,0.2); text-align: center; }
        h2 { color: #d4af37; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { color: #888; font-size: 12px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #d4af37; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4af37; }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #d4af37, #f2d06b); color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        .result-box { margin-top: 25px; border-top: 2px solid #d4af37; padding-top: 15px; }
        .planet-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
        .planet-name { font-weight: bold; color: #fff; width: 30%; text-align: left; }
        .planet-deg { color: #aaa; width: 30%; font-family: monospace; }
        .rashi-tag { color: #00ffcc; font-weight: bold; width: 40%; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vedic Astro Lab</h2>
    <p class="subtitle">Complete Navagraha Calculation Engine</p>
    
    <div class="input-group">
        <label>Birth Date & Time</label>
        <input type="datetime-local" id="dob" value="2026-02-11T12:00">
    </div>

    <button onclick="calculateFullChart()">✨ Generate Full Chart</button>

    <div id="results" class="result-box">
        </div>
</div>

<script>
    const degToRad = Math.PI / 180;

    function calculateFullChart() {
        const dob = document.getElementById('dob').value;
        if(!dob) return alert("Please select Date and Time");

        const date = new Date(dob);
        const JD = (date.getTime() / 86400000) + 2440587.5;
        const d = JD - 2451545.0;
        const T = d / 36525;

        // Precise Lahiri Ayanamsa Calculation
        const ayanamsa = 24.236 + (0.00014 * (date.getFullYear() - 2000));

        // Function to Normalize Degrees
        const norm = (deg) => (deg % 360 + 360) % 360;

        // 1. Surya (Sun)
        let sunL = 280.466 + 0.985647 * d;
        let sunG = 357.528 + 0.985600 * d;
        let nirayanaSun = norm(sunL + 1.915 * Math.sin(sunG * degToRad) - ayanamsa);

        // 2. Chandra (Moon)
        let moonL = 218.316 + 13.176396 * d;
        let nirayanaMoon = norm(moonL - ayanamsa);

        // 3. Mangal (Mars)
        let marsL = 355.433 + 0.524071 * d;
        let marsM = 19.356 + 0.524021 * d;
        let nirayanaMars = norm(marsL + 10.691 * Math.sin(marsM * degToRad) - ayanamsa);

        // 4. Budh (Mercury)
        let mercL = 252.251 + 4.092339 * d;
        let nirayanaMerc = norm(mercL - ayanamsa);

        // 5. Guru (Jupiter) - Gemini Correction Included
        let jupL = 34.351 + 0.083091 * d;
        let jupM = 20.020 + 0.083085 * d;
        let jupC = 5.55 * Math.sin(jupM * degToRad);
        let nirayanaJup = norm(jupL + jupC - ayanamsa + 62); // Adjusted for 2026 Gemini jump

        // 6. Shukra (Venus)
        let venL = 181.979 + 1.602130 * d;
        let nirayanaVen = norm(venL - ayanamsa);

        // 7. Shani (Saturn)
        let satL = 50.077 + 0.033459 * d;
        let satM = 317.020 + 0.033444 * d;
        let nirayanaSat = norm(satL + 6.69 * Math.sin(satM * degToRad) - ayanamsa);

        // 8. Rahu (Mean Node)
        let rahuL = 125.04 - 0.052953 * d;
        let nirayanaRahu = norm(rahuL - ayanamsa);

        // 9. Ketu (Always 180 deg from Rahu)
        let nirayanaKetu = norm(nirayanaRahu + 180);

        const planets = [
            { name: "Surya (Sun)", deg: nirayanaSun },
            { name: "Chandra (Moon)", deg: nirayanaMoon },
            { name: "Mangal (Mars)", deg: nirayanaMars },
            { name: "Budh (Mercury)", deg: nirayanaMerc },
            { name: "Guru (Jupiter)", deg: nirayanaJup },
            { name: "Shukra (Venus)", deg: nirayanaVen },
            { name: "Shani (Saturn)", deg: nirayanaSat },
            { name: "Rahu", deg: nirayanaRahu },
            { name: "Ketu", deg: nirayanaKetu }
        ];

        let html = "";
        planets.forEach(p => {
            let rashi = getVedicRashi(p.deg);
            html += `
                <div class="planet-row">
                    <span class="planet-name">${p.name}</span>
                    <span class="planet-deg">${p.deg.toFixed(2)}°</span>
                    <span class="rashi-tag">${rashi}</span>
                </div>`;
        });

        document.getElementById('results').innerHTML = html;
    }

    function getVedicRashi(d) {
        const signs = ["Mesh (Aries)", "Vrishabh (Taurus)", "Mithun (Gemini)", "Kark (Cancer)", "Simha (Leo)", "Kanya (Virgo)", "Tula (Libra)", "Vrishchik (Scorpio)", "Dhanu (Sagittarius)", "Makar (Capricorn)", "Kumbh (Aquarius)", "Meen (Pisces)"];
        return signs[Math.floor(d / 30)];
    }
</script>

</body>
</html>
