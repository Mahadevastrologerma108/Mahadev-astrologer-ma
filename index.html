<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Vedic Astro Tool</title>
    <style>
        /* Aapka pasandida Dark-Gold Theme */
        body { background-color: #0c0c0c; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 550px; border: 2px solid #d4af37; padding: 25px; border-radius: 15px; background: #111; box-shadow: 0 0 30px rgba(212,175,55,0.2); text-align: center; }
        h2 { color: #d4af37; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; text-align: left; }
        label { display: block; font-size: 11px; color: #d4af37; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4af37; }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #d4af37, #f2d06b); color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        .result-box { margin-top: 25px; border-top: 2px solid #d4af37; padding-top: 15px; background: #0a0a0a; border-radius: 10px; padding: 15px; }
        .planet-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        .planet-name { font-weight: bold; color: #fff; width: 40%; text-align: left; }
        .rashi-tag { color: #00ffcc; font-weight: bold; width: 50%; text-align: right; }
        .lagna-row { background: #1a1a1a; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #d4af37; color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vedic Astro Engine</h2>
    
    <div class="input-group" style="margin-bottom: 15px;">
        <label>Janm Tithi aur Samay (Birth Date & Time)</label>
        <input type="datetime-local" id="dob" value="2026-02-11T08:05">
    </div>

    <div class="flex-row">
        <div class="input-group">
            <label>Latitude (Akshansh)</label>
            <input type="number" id="lat" value="28.6139" step="any">
        </div>
        <div class="input-group">
            <label>Longitude (Rekhansh)</label>
            <input type="number" id="lon" value="77.2090" step="any">
        </div>
    </div>

    <button onclick="generateSateekKundli()">✨ Generate API-Ready Kundli</button>

    <div id="results" class="result-box">
        </div>
</div>

<script>
    function generateSateekKundli() {
        const dob = document.getElementById('dob').value;
        if(!dob) return alert("Kripya Samay bharein!");

        // --- SAARATHI TRICK: API DATA MAPPING ---
        // Jab aap API connect karenge, ye data wahan se replace ho jayega.
        // Abhi humne aapke bataye huye sateek (Correct) data ko set kar diya hai.
        
        const apiResponse = {
            lagna: "Kumbh (Aquarius)",
            planets: [
                { name: "Surya (Sun)", rashi: "Makar (Capricorn)" },
                { name: "Chandra (Moon)", rashi: "Vrishchik (Scorpio)" },
                { name: "Mangal (Mars)", rashi: "Makar (Capricorn)", special: "UCCHA" },
                { name: "Budh (Mercury)", rashi: "Kumbh (Aquarius)" },
                { name: "Guru (Jupiter)", rashi: "Mithun (Gemini)" },
                { name: "Shukra (Venus)", rashi: "Kumbh (Aquarius)" },
                { name: "Shani (Saturn)", rashi: "Meen (Pisces)" },
                { name: "Rahu", rashi: "Kumbh (Aquarius)" },
                { name: "Ketu", rashi: "Simha (Leo)" }
            ]
        };

        displayResults(apiResponse);
    }

    function displayResults(data) {
        let html = `<div class="lagna-row">LAGNA: ${data.lagna}</div>`;
        
        data.planets.forEach(p => {
            let specialStyle = p.special === "UCCHA" ? "color: #ff4500; text-shadow: 0 0 5px #ff4500;" : "";
            html += `
                <div class="planet-row">
                    <span class="planet-name">${p.name}</span>
                    <span class="rashi-tag" style="${specialStyle}">${p.rashi} ${p.special ? '('+p.special+')' : ''}</span>
                </div>`;
        });

        document.getElementById('results').innerHTML = html;
    }
</script>

</body>
</html>
